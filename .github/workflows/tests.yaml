name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Clone this repository
      uses: actions/checkout@v6

    - name: Set up Python 3.9
      uses: actions/setup-python@v6
      with:
        python-version: "3.9"

    - name: Install Dependencies
      id: dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . --group dev

    # always() && ... is so that all checks get run (but only if deps install)
    # otherwise it'd stop on the first failed check

    - name: Lint with Ruff
      if: always() && steps.dependencies.conclusion == 'success'
      run: ruff check

    - name: Check format with Ruff
      if: always() && steps.dependencies.conclusion == 'success'
      run: ruff format --check --diff

    - name: Type check with mypy
      if: always() && steps.dependencies.conclusion == 'success'
      run: mypy ccsds_cop tests

    - name: Run unittests
      if: always() && steps.dependencies.conclusion == 'success'
      run: pytest

    - name: Test building pypi package
      if: always() && steps.dependencies.conclusion == 'success'
      run: python -m build
